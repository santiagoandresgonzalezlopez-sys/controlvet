# Recuperación de datos desde un respaldo.
#   ansible-playbook playbooks/restore.yml -e archivo=/backups/controlvet-AAAA-MM-DD_HHMMSS.sql.gz
# Sin "archivo" se usa el respaldo más reciente de cv_backup_dir.
- name: Restaurar las bases de datos de ControlVet
  hosts: docker_hosts
  gather_facts: true
  tasks:
    - name: Ubicar el respaldo más reciente
      ansible.builtin.shell: ls -1t {{ cv_backup_dir }}/controlvet-*.sql.gz | head -n1
      register: ultimo
      changed_when: false
      when: archivo is not defined

    - name: Fijar el archivo a restaurar
      ansible.builtin.set_fact:
        respaldo: "{{ archivo | default(ultimo.stdout) }}"

    - name: Verificar que el respaldo existe
      ansible.builtin.stat:
        path: "{{ respaldo }}"
      register: st
      failed_when: not st.stat.exists

    - name: Detener los microservicios (evita escrituras durante la restauración)
      ansible.builtin.command: docker stop {{ (cv_servicios + ['web']) | map('regex_replace', '^(.*)$', cv_project ~ '-\1-1') | join(' ') }}
      changed_when: true

    - name: Restaurar el volcado
      ansible.builtin.shell: >-
        set -o pipefail &&
        gunzip -c {{ respaldo }} |
        docker exec -i {{ cv_project }}-db-1 sh -c 'exec mariadb -uroot -p"$MARIADB_ROOT_PASSWORD"'
      args:
        executable: /bin/bash
      changed_when: true

    - name: Volver a iniciar los microservicios
      ansible.builtin.command: docker start {{ (cv_servicios + ['web']) | map('regex_replace', '^(.*)$', cv_project ~ '-\1-1') | join(' ') }}
      changed_when: true

    - name: Verificar el entorno restaurado
      ansible.builtin.include_tasks: tasks/verificar.yml

    - name: Anotar en el historial
      ansible.builtin.lineinfile:
        path: "{{ cv_ops_dir }}/releases/history.log"
        line: "{{ ansible_date_time.iso8601 }} RESTORE {{ respaldo | basename }} OK"
        create: true
        mode: "0640"
