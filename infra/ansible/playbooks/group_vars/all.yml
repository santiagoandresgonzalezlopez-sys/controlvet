# Variables comunes de operación de ControlVet.
cv_project: controlvet
cv_registry: localhost:5000
cv_ops_dir: /opt/controlvet
cv_compose_file: /ops/app/compose.yaml
cv_env_file: "{{ cv_ops_dir }}/controlvet.env"
cv_backup_dir: "{{ cv_ops_dir }}/backups"
cv_backup_retention: 7
cv_wait_timeout: 180

cv_app_env: prod
cv_web_port: 8090

cv_servicios: [auth, pacientes, citas, clinica, inventario, documentos]
cv_contenedores: "{{ ['db'] + cv_servicios + ['web'] }}"
cv_esquemas: "{{ cv_servicios | map('regex_replace', '^', 'cv_') | list }}"
