# Reversión a la versión anterior del entorno (o a una concreta).
#   ansible-playbook -i inventarios/local.yml playbooks/rollback.yml -e cv_entorno=produccion [-e cv_destino=1.1.5]
- name: Revertir ControlVet
  hosts: windows_xampp
  gather_facts: true
  tasks:
    - name: Preparación y verificaciones del equipo
      ansible.builtin.include_tasks: tasks/preparar.yml

    - name: Leer la versión anterior registrada
      ansible.builtin.slurp:
        src: "{{ cv_estado_dir }}/previous"
      register: previa_raw
      failed_when: false

    - name: Determinar la versión destino
      ansible.builtin.set_fact:
        destino: "{{ cv_destino | default((previa_raw.content | default('') | b64decode).strip(), true) }}"

    - name: Validar la versión destino
      ansible.builtin.assert:
        that:
          - destino | length > 0
          - destino != cv_version_actual
        fail_msg: "No hay una versión anterior distinta de {{ cv_version_actual }}; indique -e cv_destino=X.Y.Z"

    - name: Comprobar que la versión destino está instalada
      ansible.builtin.stat:
        path: "{{ cv_releases }}/{{ cv_entorno }}/{{ destino }}/VERSION"
      register: instalada
      failed_when: not instalada.stat.exists

    - name: Activar {{ destino }}
      ansible.builtin.include_tasks: tasks/activar.yml
      vars:
        cv_version_objetivo: "{{ destino }}"

    - name: Verificar la versión restaurada
      ansible.builtin.include_tasks: tasks/verificar.yml
      vars:
        cv_version_esperada: "{{ destino }}"

    - name: Registrar la reversión
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}\n"
        mode: "0644"
      loop:
        - { dest: "{{ cv_estado_dir }}/current", content: "{{ destino }}" }
        - { dest: "{{ cv_estado_dir }}/previous", content: "{{ cv_version_actual }}" }

    - name: Historial
      ansible.builtin.lineinfile:
        path: "{{ cv_estado_dir }}/history.log"
        line: "{{ ansible_date_time.iso8601 }} ROLLBACK {{ cv_entorno }} {{ cv_version_actual }} -> {{ destino }} OK"
        create: true
        mode: "0644"
