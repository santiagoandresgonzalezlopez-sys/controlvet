# Preparación y verificación del equipo de despliegue (idempotente).
- name: Validar el entorno solicitado
  ansible.builtin.assert:
    that: cv_entorno in cv_entornos
    fail_msg: "Entorno desconocido '{{ cv_entorno }}'. Use: {{ cv_entornos.keys() | join(', ') }}"

- name: Fijar datos del entorno {{ cv_entorno }}
  ansible.builtin.set_fact:
    ent: "{{ cv_entornos[cv_entorno] }}"
    cv_enlace: "{{ cv_htdocs }}/{{ cv_entornos[cv_entorno].ruta }}"
    cv_url: "{{ cv_url_base }}/{{ cv_entornos[cv_entorno].ruta }}"
    cv_estado_dir: "{{ cv_estado }}/{{ cv_entorno }}"

- name: Verificar la interoperabilidad WSL -> Windows
  ansible.builtin.command: "{{ cv_cmd }} /c echo interop-ok"
  register: ver_windows
  changed_when: false

- name: Verificar que Apache de XAMPP responde en el puerto 80
  ansible.builtin.command: "{{ cv_curl }} -s -o NUL -w %{http_code} {{ cv_url_base }}/"
  register: apache
  changed_when: false
  failed_when: apache.stdout | length == 0 or apache.stdout == '000'

- name: Verificar la instancia MariaDB de ControlVet (127.0.0.1:{{ cv_db_puerto }})
  ansible.builtin.command: >-
    {{ cv_powershell }} -NoProfile -Command
    "if (Get-NetTCPConnection -State Listen -LocalPort {{ cv_db_puerto }} -ErrorAction SilentlyContinue) { 'ACTIVA' } else { 'DETENIDA' }"
  register: bd
  changed_when: false

- name: Exigir la base de datos activa
  ansible.builtin.assert:
    that: "'ACTIVA' in bd.stdout"
    fail_msg: "La instancia MariaDB está detenida: ejecute recover.yml o infra\\xampp\\bd.ps1 iniciar"

- name: Crear directorios de operación
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ cv_artefactos }}"
    - "{{ cv_releases }}/{{ cv_entorno }}"
    - "{{ cv_estado_dir }}"
    - "{{ cv_respaldos }}"

- name: Leer la versión activa del entorno
  ansible.builtin.slurp:
    src: "{{ cv_estado_dir }}/current"
  register: actual_raw
  failed_when: false

- name: Registrar la versión activa
  ansible.builtin.set_fact:
    cv_version_actual: "{{ (actual_raw.content | default('') | b64decode).strip() }}"
