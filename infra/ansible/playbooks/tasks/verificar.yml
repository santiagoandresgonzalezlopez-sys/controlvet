# Verificación posterior: /health de cada microservicio (incluida su base de
# datos) con la versión esperada, salud agregada del frontend y login.
- name: Consultar /health de cada microservicio
  ansible.builtin.command: "{{ cv_curl }} -s --max-time 10 {{ cv_url }}/api/{{ item }}/health"
  register: salud
  changed_when: false
  retries: 5
  delay: 2
  until: salud.stdout is search('"status":"ok"')
  loop: "{{ cv_servicios }}"

- name: Validar estado, base de datos y versión
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json).status == 'ok'
      - (item.stdout | from_json).checks.database == 'ok'
      - cv_version_esperada is not defined or (item.stdout | from_json).version == cv_version_esperada
    fail_msg: "{{ item.item }} no está sano o no corre la versión {{ cv_version_esperada | default('?') }}: {{ item.stdout }}"
    success_msg: "{{ item.item }} OK · versión {{ (item.stdout | from_json).version }}"
    quiet: false
  loop: "{{ salud.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Salud agregada del frontend
  ansible.builtin.command: "{{ cv_curl }} -s --max-time 15 {{ cv_url }}/web/health.php"
  register: salud_web
  changed_when: false
  failed_when: (salud_web.stdout | from_json).status != 'ok'

- name: Página de login del frontend
  ansible.builtin.command: "{{ cv_curl }} -s -o NUL -w %{http_code} {{ cv_url }}/web/index.php?route=login"
  register: login
  changed_when: false
  failed_when: login.stdout != '200'
