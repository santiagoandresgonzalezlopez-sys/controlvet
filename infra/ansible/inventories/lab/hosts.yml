# Inventario de ejemplo para un servidor Linux remoto (VM Ubuntu del
# laboratorio) administrado por SSH. ESTADO: planificado, no ejecutado.
# Para usarlo: instalar Docker en la VM, copiar la llave SSH y ejecutar
#   ansible-playbook -i inventories/lab/hosts.yml playbooks/site.yml
# (los playbooks usan solo módulos builtin + CLI de docker, válidos en ambos casos).
all:
  children:
    docker_hosts:
      hosts:
        vm-controlvet:
          ansible_host: 192.168.56.10
          ansible_user: devops
          ansible_become: true
          cv_entorno: lab
          cv_app_env: prod
          cv_web_port: 80
          cv_ops_dir: /opt/controlvet
