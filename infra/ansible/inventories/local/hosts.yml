# Inventario del entorno LOCAL (equipo Windows + Docker Desktop).
# El controlador Ansible corre en el contenedor "ops" (Linux) y administra el
# motor Docker del equipo por el socket /var/run/docker.sock.
all:
  children:
    docker_hosts:
      hosts:
        local:
          ansible_connection: local
          cv_entorno: local
          cv_app_env: dev          # muestra las credenciales demo en el login (solo laboratorio)
          cv_web_port: 8090
