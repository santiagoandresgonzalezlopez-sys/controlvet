# =====================================================================
# Plataforma DevOps de ControlVet (se levanta UNA vez, desde la raíz):
#   docker compose -f infra/compose.platform.yaml --env-file infra/.env.platform up -d --build
#
#   registry  -> repositorio de artefactos (imágenes versionadas)   :5000
#   jenkins   -> RELEASE: pipeline declarativo (Jenkinsfile)        :8091
#   nagios    -> MONITOR: disponibilidad y alertas                  :8092
# =====================================================================
name: controlvet-platform

services:
  registry:
    image: registry:2
    container_name: controlvet-registry
    restart: unless-stopped
    ports: ["5000:5000"]
    volumes: [registry_data:/var/lib/registry]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

  jenkins:
    build: { context: .., dockerfile: infra/jenkins/Dockerfile }
    image: controlvet/jenkins:local
    container_name: controlvet-jenkins
    restart: unless-stopped
    ports: ["8091:8080"]
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Defina JENKINS_ADMIN_PASSWORD en infra/.env.platform}
      JENKINS_URL: http://localhost:8091/
      CV_REGISTRY: localhost:5000
      # Origen del código. Con el repositorio GitHub creado, usar su URL https.
      CONTROLVET_GIT_URL: ${CONTROLVET_GIT_URL:-file:///repo}
    volumes:
      - jenkins_home:/var/jenkins_home
      # Acceso al motor Docker del equipo (equivale a privilegios de root sobre
      # Docker): aceptable en el laboratorio local, documentado como riesgo.
      - /var/run/docker.sock:/var/run/docker.sock
      # Espejo de solo lectura del repositorio local (si aún no hay remoto GitHub).
      - ..:/repo:ro
    group_add: ["0"]
    depends_on: [registry]

  nagios:
    build: { context: .., dockerfile: infra/nagios/Dockerfile }
    image: controlvet/nagios:local
    container_name: controlvet-nagios
    restart: unless-stopped
    ports: ["8092:80"]
    environment:
      NAGIOSADMIN_USER: ${NAGIOS_ADMIN_USER:-nagiosadmin}
      NAGIOSADMIN_PASS: ${NAGIOS_ADMIN_PASSWORD:?Defina NAGIOS_ADMIN_PASSWORD en infra/.env.platform}
      TZ: America/Bogota
    volumes:
      - nagios_var:/opt/nagios/var
      # Secretos generados por Ansible: Nagios lee solo la clave del usuario de monitoreo.
      - controlvet_ops:/opt/controlvet:ro

volumes:
  registry_data:
  jenkins_home:
  nagios_var:
  controlvet_ops:
    name: controlvet_ops
