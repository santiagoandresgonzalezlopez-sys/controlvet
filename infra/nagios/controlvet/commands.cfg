###############################################################################
# ControlVet · comandos de comprobación y notificación
###############################################################################

# Salud de un microservicio: HTTP 200 + JSON con "status":"ok" (incluye la
# conexión a SU esquema de base de datos). ARG1/ARG2 = umbral warning/critical
# de tiempo de respuesta en segundos.
define command {
    command_name    check_cv_health
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 80 -u /health -e 200 -s '"status":"ok"' -w $ARG1$ -c $ARG2$ -t 10
}

# Página de login del frontend.
define command {
    command_name    check_cv_web_login
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 80 -u '/index.php?route=login' -e 200 -s 'ControlVet' -w $ARG1$ -c $ARG2$ -t 10
}

# Salud agregada del frontend: falla si cualquier microservicio no responde.
define command {
    command_name    check_cv_web_deps
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 80 -u /health.php -e 200 -s '"status":"ok"' -w $ARG1$ -c $ARG2$ -t 10
}

define command {
    command_name    check_cv_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w 1 -c 3
}

define command {
    command_name    check_cv_mysql
    command_line    $USER2$/check_cv_mysql $HOSTADDRESS$
}

# Alertas verificables: cada notificación queda en un registro con fecha,
# tipo (PROBLEM/RECOVERY), servicio, estado y salida del plugin.
define command {
    command_name    notify-service-by-file
    command_line    /usr/bin/printf "%b" "$LONGDATETIME$ | SERVICE | $NOTIFICATIONTYPE$ | $HOSTNAME$ | $SERVICEDESC$ | $SERVICESTATE$ | $SERVICEOUTPUT$ | contacto=$CONTACTNAME$\n" >> /opt/nagios/var/controlvet-alertas.log
}

define command {
    command_name    notify-host-by-file
    command_line    /usr/bin/printf "%b" "$LONGDATETIME$ | HOST | $NOTIFICATIONTYPE$ | $HOSTNAME$ | - | $HOSTSTATE$ | $HOSTOUTPUT$ | contacto=$CONTACTNAME$\n" >> /opt/nagios/var/controlvet-alertas.log
}
