###############################################################################
# ControlVet · comandos de comprobación y notificación (Nagios 4 en WSL2)
###############################################################################

# Salud de un microservicio: HTTP 200 y JSON con "status":"ok" (incluye la
# conexión del servicio a SU esquema de base de datos).
# ARG1 = ruta del endpoint, ARG2/ARG3 = umbral warning/critical en segundos.
define command {
    command_name    check_cv_health
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 80 -u $ARG1$ -e 200 -s '"status":"ok"' -w $ARG2$ -c $ARG3$ -t 10
}

# Página que debe responder 200 y contener un texto (ARG2).
define command {
    command_name    check_cv_pagina
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 80 -u '$ARG1$' -e 200 -s '$ARG2$' -w 2 -c 5 -t 10
}

define command {
    command_name    check_cv_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w 1 -c 3
}

# La instancia MariaDB escucha solo en 127.0.0.1 de Windows: se comprueba con
# mysqladmin.exe de XAMPP mediante la interoperabilidad de WSL.
define command {
    command_name    check_cv_mysql
    command_line    /usr/local/lib/controlvet-nagios/check_cv_mysql
}

# Alertas verificables: cada notificación queda registrada con fecha, tipo
# (PROBLEM/RECOVERY), servicio, estado, salida del plugin y contacto.
define command {
    command_name    notify-service-by-file
    command_line    /usr/bin/printf "%b" "$LONGDATETIME$ | SERVICE | $NOTIFICATIONTYPE$ | $HOSTNAME$ | $SERVICEDESC$ | $SERVICESTATE$ | $SERVICEOUTPUT$ | contacto=$CONTACTNAME$\n" >> /var/log/nagios4/controlvet-alertas.log
}

define command {
    command_name    notify-host-by-file
    command_line    /usr/bin/printf "%b" "$LONGDATETIME$ | HOST | $NOTIFICATIONTYPE$ | $HOSTNAME$ | - | $HOSTSTATE$ | $HOSTOUTPUT$ | contacto=$CONTACTNAME$\n" >> /var/log/nagios4/controlvet-alertas.log
}
