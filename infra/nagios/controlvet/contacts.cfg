###############################################################################
# ControlVet · responsables de la operación
###############################################################################

define contact {
    contact_name                    santiago.gonzalez
    alias                           Santiago Gonzalez
    use                             generic-contact
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_options    w,u,c,r
    host_notification_options       d,u,r
    service_notification_commands   notify-service-by-file
    host_notification_commands      notify-host-by-file
}

define contact {
    contact_name                    sebastian.gomez
    alias                           Sebastian Gomez
    use                             generic-contact
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_options    w,u,c,r
    host_notification_options       d,u,r
    service_notification_commands   notify-service-by-file
    host_notification_commands      notify-host-by-file
}

define contactgroup {
    contactgroup_name   controlvet-ops
    alias               Operación ControlVet
    members             santiago.gonzalez,sebastian.gomez
}
