###############################################################################
# ControlVet · servicios supervisados
###############################################################################

# Salud de cada microservicio (proceso + conexión a su base de datos).
# warning > 1 s, critical > 3 s o respuesta distinta de 200/"status":"ok".
define service {
    use                     controlvet-service
    hostgroup_name          controlvet-microservicios
    service_description     API salud
    check_command           check_cv_health!1!3
}

define service {
    use                     controlvet-service
    host_name               web
    service_description     Login web
    check_command           check_cv_web_login!2!5
}

define service {
    use                     controlvet-service
    host_name               web
    service_description     Dependencias del frontend
    check_command           check_cv_web_deps!2!5
}

define service {
    use                     controlvet-service
    host_name               db
    service_description     MariaDB conexion
    check_command           check_cv_mysql
}
