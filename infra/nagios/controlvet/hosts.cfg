###############################################################################
# ControlVet · hosts supervisados (contenedores en la red interna "backend")
# Umbrales: 1 comprobación por minuto; estado HARD (y alerta) tras 2 fallos
# consecutivos, es decir, un fallo se notifica en 1–2 minutos.
###############################################################################

define host {
    name                    controlvet-host
    use                     generic-host
    check_interval          1
    retry_interval          1
    max_check_attempts      2
    notification_interval   0
    notification_period     24x7
    notification_options    d,u,r
    contact_groups          controlvet-ops
    register                0
}

define service {
    name                    controlvet-service
    use                     generic-service
    check_interval          1
    retry_interval          1
    max_check_attempts      2
    notification_interval   0
    notification_options    w,u,c,r
    contact_groups          controlvet-ops
    register                0
}

define hostgroup {
    hostgroup_name  controlvet-microservicios
    alias           ControlVet · microservicios
    members         auth,pacientes,citas,clinica,inventario,documentos
}

define hostgroup {
    hostgroup_name  controlvet-plataforma
    alias           ControlVet · frontend y base de datos
    members         web,db
}

define host {
    use             controlvet-host
    host_name       auth
    alias           Servicio auth (usuarios y JWT)
    address         auth
    check_command   check_cv_tcp!80
}
define host {
    use             controlvet-host
    host_name       pacientes
    alias           Servicio pacientes
    address         pacientes
    check_command   check_cv_tcp!80
}
define host {
    use             controlvet-host
    host_name       citas
    alias           Servicio citas
    address         citas
    check_command   check_cv_tcp!80
}
define host {
    use             controlvet-host
    host_name       clinica
    alias           Servicio clínica
    address         clinica
    check_command   check_cv_tcp!80
}
define host {
    use             controlvet-host
    host_name       inventario
    alias           Servicio inventario
    address         inventario
    check_command   check_cv_tcp!80
}
define host {
    use             controlvet-host
    host_name       documentos
    alias           Servicio documentos
    address         documentos
    check_command   check_cv_tcp!80
}
define host {
    use             controlvet-host
    host_name       web
    alias           Frontend web
    address         web
    check_command   check_cv_tcp!80
}
define host {
    use             controlvet-host
    host_name       db
    alias           MariaDB (un esquema por servicio)
    address         db
    check_command   check_cv_tcp!3306
}
