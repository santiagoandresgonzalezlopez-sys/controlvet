# VirtualHost del frontend web de ControlVet.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

SetEnvIf Request_URI "^/health\.php$" dontlog

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride None
        Options -Indexes
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Código interno: solo se ejecuta incluido desde index.php, nunca por URL.
    <DirectoryMatch "^/var/www/html/(config|core|includes|models|viewmodels|views)/">
        Require all denied
    </DirectoryMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=!dontlog
</VirtualHost>
