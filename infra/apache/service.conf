# VirtualHost de un microservicio ControlVet: todo se enruta a public/index.php.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Los health checks (Docker cada 15 s, Nagios cada minuto) no se registran
# en el log de acceso para no ocultar el tráfico real.
SetEnvIf Request_URI "^/health$" dontlog

<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        AllowOverride None
        Options -Indexes
        Require all granted
        FallbackResource /index.php
    </Directory>

    Header always set X-Content-Type-Options "nosniff"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=!dontlog
</VirtualHost>
