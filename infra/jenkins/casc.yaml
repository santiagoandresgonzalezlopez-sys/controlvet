# Jenkins Configuration as Code de ControlVet (Jenkins nativo en Windows).
# Los secretos llegan por variables de entorno que define infra/jenkins/iniciar.ps1
# desde C:\xampp\controlvet-secretos\jenkins.env (fuera del repositorio y de htdocs).
jenkins:
  systemMessage: "ControlVet · Pipeline DevOps (RELEASE) sin contenedores. Responsables: Santiago Gonzalez y Sebastian Gomez."
  numExecutors: 1
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8091/"

jobs:
  - script: >
      pipelineJob('controlvet-pipeline') {
        displayName('ControlVet · build, test, release y deploy')
        description('Pipeline declarativo del Jenkinsfile del repositorio. GitHub se usa solo como origen del código (consulta por polling, sin GitHub Actions).')
        logRotator { numToKeep(30); artifactNumToKeep(10) }
        properties {
          disableConcurrentBuilds()
          pipelineTriggers { triggers { pollSCM { scmpoll_spec('H/5 * * * *') } } }
        }
        definition {
          cpsScm {
            lightweight(false)
            scriptPath('Jenkinsfile')
            scm {
              git {
                remote { url('${CONTROLVET_GIT_URL}') }
                branch('*/main')
              }
            }
          }
        }
      }
