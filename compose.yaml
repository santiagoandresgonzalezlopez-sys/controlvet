# =====================================================================
# ControlVet · entorno de microservicios (fase DEPLOY con Docker)
#
#   docker compose --env-file .env up -d --build
#
# Variables obligatorias en .env (NO versionado; ver .env.example).
# Las imágenes se etiquetan como ${CV_REGISTRY}/controlvet/<svc>:${CV_VERSION}
# para que Jenkins publique versiones y Ansible despliegue o revierta una
# versión concreta sin reconstruir.
# =====================================================================
name: ${CV_PROJECT:-controlvet}

x-service: &service
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-service-env: &service-env
  APP_ENV: ${APP_ENV:-prod}
  JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
  JWT_ISSUER: ControlVet
  DB_HOST: db
  DB_PORT: "3306"

x-depends-db: &depends-db
  db:
    condition: service_healthy

services:
  # ------------------------------------------------------------ Persistencia
  db:
    <<: *service
    image: ${CV_REGISTRY:-localhost:5000}/controlvet/db:${CV_VERSION:-dev}
    build:
      context: .
      dockerfile: infra/db/Dockerfile
      args: { APP_VERSION: "${CV_VERSION:-dev}" }
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD en .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      PACIENTES_DB_PASSWORD: ${PACIENTES_DB_PASSWORD:?}
      CITAS_DB_PASSWORD: ${CITAS_DB_PASSWORD:?}
      CLINICA_DB_PASSWORD: ${CLINICA_DB_PASSWORD:?}
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_DB_PASSWORD:?}
      DOCUMENTOS_DB_PASSWORD: ${DOCUMENTOS_DB_PASSWORD:?}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?}
      TZ: America/Bogota
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------- Microservicios
  auth:
    <<: *service
    image: ${CV_REGISTRY:-localhost:5000}/controlvet/auth:${CV_VERSION:-dev}
    build: { context: ., dockerfile: services/auth/Dockerfile, args: { APP_VERSION: "${CV_VERSION:-dev}" } }
    environment:
      <<: *service-env
      DB_NAME: cv_auth
      DB_USER: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
    depends_on: *depends-db

  pacientes:
    <<: *service
    image: ${CV_REGISTRY:-localhost:5000}/controlvet/pacientes:${CV_VERSION:-dev}
    build: { context: ., dockerfile: services/pacientes/Dockerfile, args: { APP_VERSION: "${CV_VERSION:-dev}" } }
    environment:
      <<: *service-env
      DB_NAME: cv_pacientes
      DB_USER: pacientes_svc
      DB_PASSWORD: ${PACIENTES_DB_PASSWORD:?}
    depends_on: *depends-db

  citas:
    <<: *service
    image: ${CV_REGISTRY:-localhost:5000}/controlvet/citas:${CV_VERSION:-dev}
    build: { context: ., dockerfile: services/citas/Dockerfile, args: { APP_VERSION: "${CV_VERSION:-dev}" } }
    environment:
      <<: *service-env
      DB_NAME: cv_citas
      DB_USER: citas_svc
      DB_PASSWORD: ${CITAS_DB_PASSWORD:?}
      PACIENTES_URL: http://pacientes
      AUTH_URL: http://auth
    depends_on: *depends-db

  clinica:
    <<: *service
    image: ${CV_REGISTRY:-localhost:5000}/controlvet/clinica:${CV_VERSION:-dev}
    build: { context: ., dockerfile: services/clinica/Dockerfile, args: { APP_VERSION: "${CV_VERSION:-dev}" } }
    environment:
      <<: *service-env
      DB_NAME: cv_clinica
      DB_USER: clinica_svc
      DB_PASSWORD: ${CLINICA_DB_PASSWORD:?}
      PACIENTES_URL: http://pacientes
    depends_on: *depends-db

  inventario:
    <<: *service
    image: ${CV_REGISTRY:-localhost:5000}/controlvet/inventario:${CV_VERSION:-dev}
    build: { context: ., dockerfile: services/inventario/Dockerfile, args: { APP_VERSION: "${CV_VERSION:-dev}" } }
    environment:
      <<: *service-env
      DB_NAME: cv_inventario
      DB_USER: inventario_svc
      DB_PASSWORD: ${INVENTARIO_DB_PASSWORD:?}
    depends_on: *depends-db

  documentos:
    <<: *service
    image: ${CV_REGISTRY:-localhost:5000}/controlvet/documentos:${CV_VERSION:-dev}
    build: { context: ., dockerfile: services/documentos/Dockerfile, args: { APP_VERSION: "${CV_VERSION:-dev}" } }
    environment:
      <<: *service-env
      DB_NAME: cv_documentos
      DB_USER: documentos_svc
      DB_PASSWORD: ${DOCUMENTOS_DB_PASSWORD:?}
      CITAS_URL: http://citas
      CLINICA_URL: http://clinica
      PACIENTES_URL: http://pacientes
      AUTH_URL: http://auth
    depends_on: *depends-db

  # ---------------------------------------------------------------- Frontend
  # Único contenedor publicado hacia el host. Los servicios y la base de
  # datos solo son accesibles dentro de la red interna "backend".
  web:
    <<: *service
    image: ${CV_REGISTRY:-localhost:5000}/controlvet/web:${CV_VERSION:-dev}
    build: { context: ., dockerfile: web/Dockerfile, args: { APP_VERSION: "${CV_VERSION:-dev}" } }
    environment:
      APP_ENV: ${APP_ENV:-prod}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_ISSUER: ControlVet
      AUTH_URL: http://auth
      PACIENTES_URL: http://pacientes
      CITAS_URL: http://citas
      CLINICA_URL: http://clinica
      INVENTARIO_URL: http://inventario
      DOCUMENTOS_URL: http://documentos
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT-8090}:80"
    networks: [frontend, backend]
    depends_on: [auth, pacientes, citas, clinica, inventario, documentos]

networks:
  # Red sin salida a Internet ni puertos publicados: tráfico entre servicios.
  backend:
    name: ${CV_PROJECT:-controlvet}_backend
    internal: true
  frontend:
    name: ${CV_PROJECT:-controlvet}_frontend

volumes:
  db_data:
    name: ${CV_PROJECT:-controlvet}_db_data
